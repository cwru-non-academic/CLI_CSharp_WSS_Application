name: WSS RC.7 compatibility

on:
  workflow_dispatch:

jobs:
  compatibility:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      WSS_RELEASE_TAG: v0.3.0-rc.7
      WSS_ARCHIVE_NAME: WSS-Serial-v0.3.0-rc.7.zip
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download and validate WSS Serial artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/wss/$WSS_RELEASE_TAG"
          archive_path="$RUNNER_TEMP/$WSS_ARCHIVE_NAME"
          checksums_path="$RUNNER_TEMP/SHA256SUMS.txt"
          gh release download "$WSS_RELEASE_TAG" \
            --repo cwru-non-academic/WSSCore \
            --pattern "$WSS_ARCHIVE_NAME" \
            --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP"
          test -f "$archive_path"
          test -f "$checksums_path"
          expected_sha="$(awk -v name="$WSS_ARCHIVE_NAME" '$2 == name { print $1 }' "$checksums_path")"
          actual_sha="$(openssl dgst -sha256 "$archive_path" | awk '{ print $NF }')"
          test -n "$expected_sha"
          test "$actual_sha" = "$expected_sha"
          mkdir -p "$artifact_dir"
          unzip -q "$archive_path" -d "$artifact_dir"
          echo "Extracted WSS artifacts: $artifact_dir"
          find "$artifact_dir" -maxdepth 1 -type f -print
          test -d "$artifact_dir"
          for assembly in \
            WSS_Core_Interface.dll \
            Newtonsoft.Json.dll \
            System.Buffers.dll \
            System.Memory.dll \
            System.Numerics.Vectors.dll \
            System.Runtime.CompilerServices.Unsafe.dll \
            System.Security.AccessControl.dll \
            System.Security.Permissions.dll \
            System.Security.Principal.Windows.dll \
            System.IO.Ports.dll; do
            test -f "$artifact_dir/$assembly"
          done
          echo "WSS_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "Verified $WSS_ARCHIVE_NAME SHA256: $actual_sha"

      - name: Disable checked-in Core DLL
        shell: bash
        run: |
          set -euo pipefail
          integration_dir="SubModules/HFI_WSS_Csharp_Implementation/lib"
          test -d "$integration_dir"
          mkdir -p "${integration_dir}.compat-disabled"
          mv "$integration_dir/WSS_Core_Interface.dll" "${integration_dir}.compat-disabled/"
          test ! -f "$integration_dir/WSS_Core_Interface.dll"
          test -f "$integration_dir/WSS.Transport.BLE.dll"

      - name: Restore with downloaded WSS artifacts
        shell: bash
        run: dotnet restore CLI_CSharp_WSS_Application.sln -p:WSS_ARTIFACT_DIR="$WSS_ARTIFACT_DIR"

      - name: Build Release with downloaded WSS artifacts
        shell: bash
        run: dotnet build CLI_CSharp_WSS_Application.sln -c Release --no-restore -p:TreatWarningsAsErrors=true -p:WSS_ARTIFACT_DIR="$WSS_ARTIFACT_DIR"

      - name: Verify WSS assembly provenance
        shell: bash
        run: |
          set -euo pipefail
          for assembly in WSS_Core_Interface.dll; do
            extracted="$WSS_ARTIFACT_DIR/$assembly"
            output="src/bin/Release/net9.0/$assembly"
            test -f "$extracted"
            test -f "$output"
            extracted_sha="$(openssl dgst -sha256 "$extracted" | awk '{print $NF}')"
            output_sha="$(openssl dgst -sha256 "$output" | awk '{print $NF}')"
            echo "$assembly extracted SHA256: $extracted_sha"
            echo "$assembly output SHA256:    $output_sha"
            test "$extracted_sha" = "$output_sha"
          done
          ble_source="SubModules/HFI_WSS_Csharp_Implementation/lib/WSS.Transport.BLE.dll"
          ble_output="src/bin/Release/net9.0/WSS.Transport.BLE.dll"
          source_sha="$(openssl dgst -sha256 "$ble_source" | awk '{print $NF}')"
          output_sha="$(openssl dgst -sha256 "$ble_output" | awk '{print $NF}')"
          echo "WSS.Transport.BLE.dll source SHA256: $source_sha"
          echo "WSS.Transport.BLE.dll output SHA256: $output_sha"
          test "$source_sha" = "$output_sha"

      - name: Run CLI compatibility smoke checks
        shell: bash
        run: |
          set -euo pipefail
          cli="src/bin/Release/net9.0/CLI_CSharp_WSS_Application.dll"
          dotnet "$cli" --help
          printf 'exit\n' | dotnet "$cli" --test
          printf 'exit\n' | dotnet "$cli" --transport=test
          dotnet "$cli" --serial-smoke

      - name: Run CLI behavioral conformance
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          cli="src/bin/Release/net9.0/CLI_CSharp_WSS_Application.dll"
          output="$RUNNER_TEMP/wss-cli-conformance.txt"
          dotnet "$cli" --conformance | tee "$output"
          grep -Fx "Initialization: PASS" "$output"
          grep -Fx "Direct analog: PASS" "$output"
          grep -Fx "Result: PASS" "$output"
