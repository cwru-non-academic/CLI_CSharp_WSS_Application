name: WSS CLI preflight
run-name: WSS preflight ${{ inputs.wss_run_id || inputs.wss_release_tag }} / ${{ inputs.correlation_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      wss_release_tag:
        description: Published universal release tag (mutually exclusive with run ID)
        required: false
        type: string
      correlation_id:
        description: Cross-repository promotion correlation identifier
        required: false
        type: string
      integration_sha:
        description: Full Integration source SHA; empty uses the committed submodule
        type: string
      wss_producer_repository:
        description: Authoritative producer repository
        default: cwru-non-academic/WSSCore
        type: string
      wss_run_id:
        description: Exact successful artifacts.yml run ID (no PR merge-ref artifacts)
        type: string
      wss_commit:
        description: Expected full producer commit SHA
        required: true
        type: string
      wss_archive:
        description: Universal ZIP filename
        default: WSS-Universal-ci.zip
        required: true
        type: string
      wss_sha256:
        description: Expected universal ZIP SHA-256
        required: true
        type: string

permissions:
  contents: read

jobs:
  provenance:
    name: WSS universal candidate provenance
    runs-on: ubuntu-latest
    outputs:
      integration-sha: ${{ steps.integration.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve Integration source revision
        id: integration
        shell: pwsh
        env:
          REQUESTED_SHA: ${{ inputs.integration_sha }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = $env:REQUESTED_SHA
          if ([string]::IsNullOrEmpty($sha)) {
            $sha = (& git rev-parse 'HEAD:SubModules/HFI_WSS_Csharp_Implementation').Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve committed Integration SHA.' }
          }
          if ($sha -notmatch '^[0-9a-fA-F]{40}$') { throw 'integration_sha must be a full commit SHA.' }
          if ($env:CORRELATION_ID.Length -gt 200 -or $env:CORRELATION_ID -match "[\r\n]") { throw 'Invalid correlation ID.' }
          "sha=$($sha.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "CLI SHA: $env:GITHUB_SHA; Integration SHA: $sha; correlation: $env:CORRELATION_ID" >> $env:GITHUB_STEP_SUMMARY
      - name: Create read-only Integration checkout token
        id: integration-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: CSharp_WSS_Integration_Lib
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ steps.integration.outputs.sha }}
          path: SubModules/HFI_WSS_Csharp_Implementation
          token: ${{ steps.integration-token.outputs.token }}
          persist-credentials: false
      - name: Verify selected Integration source
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ steps.integration.outputs.sha }}
        run: |
          $actual = (& git -C SubModules/HFI_WSS_Csharp_Implementation rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SHA) { throw 'Selected Integration checkout mismatch.' }
          if (-not (Test-Path -LiteralPath 'SubModules/HFI_WSS_Csharp_Implementation/.github/scripts/Universal-WssFiles.ps1')) {
            throw 'Selected Integration source predates universal preflight support. Supply integration_sha for the updated source; no newer source will be silently substituted.'
          }
      - name: Create producer read token
        id: core-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Download, verify, and extract universal candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.core-token.outputs.token }}
          PRODUCER_REPOSITORY: ${{ inputs.wss_producer_repository }}
          RUN_ID: ${{ inputs.wss_run_id }}
          EXPECTED_COMMIT: ${{ inputs.wss_commit }}
          ARCHIVE: ${{ inputs.wss_archive }}
          SHA256: ${{ inputs.wss_sha256 }}
          RELEASE_TAG: ${{ inputs.wss_release_tag }}
        run: |
          ./SubModules/HFI_WSS_Csharp_Implementation/.github/scripts/Resolve-WssRelease.ps1 -ProducerRepository $env:PRODUCER_REPOSITORY -RunId $env:RUN_ID -ReleaseTag $env:RELEASE_TAG -ExpectedCommit $env:EXPECTED_COMMIT -ArchiveName $env:ARCHIVE -ExpectedSha256 $env:SHA256 -OutputRoot "$env:RUNNER_TEMP/wss-release"
      - name: Upload verified universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-wss-universal
          path: ${{ runner.temp }}/wss-release/extracted/WSS-Universal
          if-no-files-found: error
          retention-days: 1

      - name: Upload candidate provenance
        uses: actions/upload-artifact@v4
        with:
          name: wss-candidate-provenance
          path: ${{ runner.temp }}/wss-release/candidate.json
          if-no-files-found: error
          retention-days: 1

  general-conformance:
    name: CLI general conformance
    needs: provenance
    runs-on: ubuntu-latest
    env:
      WSS_ARTIFACT_DIR: ${{ github.workspace }}/.wss-artifacts/universal
      WSS_BLE_ARTIFACT_DIR: ${{ github.workspace }}/.wss-artifacts/universal
    steps:
      - name: Create read-only Integration checkout token
        id: integration-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: CSharp_WSS_Integration_Lib
          permission-contents: read

      - name: Check out CLI
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve selected Integration SHA
        id: integration
        shell: pwsh
        env:
          SELECTED_SHA: ${{ needs.provenance.outputs.integration-sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = $env:SELECTED_SHA
          if ($sha -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve the selected Integration SHA.'
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Check out committed Integration submodule
        uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ steps.integration.outputs.sha }}
          path: SubModules/HFI_WSS_Csharp_Implementation
          token: ${{ steps.integration-token.outputs.token }}
          persist-credentials: false

      - name: Verify committed Integration checkout
        shell: pwsh
        env:
          EXPECTED_INTEGRATION_SHA: ${{ steps.integration.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $integrationPath = 'SubModules/HFI_WSS_Csharp_Implementation'
          $actualSha = (& git -C $integrationPath rev-parse HEAD).Trim()
          $remoteUrl = (& git -C $integrationPath remote get-url origin).Trim().TrimEnd('/')
          $normalizedRemote = $remoteUrl -replace '\.git$', ''
          if ($actualSha -ne $env:EXPECTED_INTEGRATION_SHA) {
            throw "Integration checkout mismatch. Expected $($env:EXPECTED_INTEGRATION_SHA); actual $actualSha."
          }
          if ($normalizedRemote -ne 'https://github.com/cwru-non-academic/CSharp_WSS_Integration_Lib') {
            throw "Unexpected Integration remote: $remoteUrl"
          }

      - name: Download verified universal artifact
        uses: actions/download-artifact@v4
        with:
          name: verified-wss-universal
          path: ${{ env.WSS_ARTIFACT_DIR }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Disable checked-in fallback and clean outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $integrationLib = 'SubModules/HFI_WSS_Csharp_Implementation/lib'
          if (-not (Test-Path -LiteralPath $integrationLib -PathType Container)) {
            throw 'The checked-in Integration lib directory is missing, so fallback disabling cannot be verified.'
          }
          Move-Item -LiteralPath $integrationLib -Destination "$integrationLib.ci-disabled"
          if (Test-Path -LiteralPath $integrationLib) {
            throw 'The checked-in Integration lib directory still exists after fallback disabling.'
          }
          foreach ($outputPath in @(
            'src/bin',
            'src/obj',
            'SubModules/HFI_WSS_Csharp_Implementation/src/bin',
            'SubModules/HFI_WSS_Csharp_Implementation/src/obj',
            'SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/bin',
            'SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/obj'
          )) {
            Remove-Item -LiteralPath $outputPath -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Restore shared conformance projects with downloaded WSS artifacts
        shell: pwsh
        run: |
          dotnet restore CLI_CSharp_WSS_Application.sln "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'CLI restore failed.' }
          dotnet restore 'SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/Wss.CSharpImplementation.Tests.csproj' "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Integration conformance test restore failed.' }

      - name: Build shared conformance projects with downloaded WSS artifacts
        shell: pwsh
        run: |
          dotnet build CLI_CSharp_WSS_Application.sln -c Release --no-restore -p:TreatWarningsAsErrors=true "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed.' }
          dotnet build 'SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/Wss.CSharpImplementation.Tests.csproj' -c Release --no-restore -p:TreatWarningsAsErrors=true "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Integration conformance test build failed.' }

      - name: Verify downloaded WSS propagation to CLI output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDir = 'src/bin/Release/net9.0'

          function Assert-SameHash([string] $SourceFile, [string] $OutputFile) {
            if (-not (Test-Path -LiteralPath $SourceFile -PathType Leaf)) {
              throw "Authoritative release file is missing: $SourceFile"
            }
            if (-not (Test-Path -LiteralPath $OutputFile -PathType Leaf)) {
              throw "CLI output file is missing: $OutputFile"
            }
            $sourceSha = (Get-FileHash -LiteralPath $SourceFile -Algorithm SHA256).Hash
            $outputSha = (Get-FileHash -LiteralPath $OutputFile -Algorithm SHA256).Hash
            if (-not $outputSha.Equals($sourceSha, [StringComparison]::OrdinalIgnoreCase)) {
              throw "CLI output hash mismatch for $OutputFile. Expected $sourceSha; actual $outputSha."
            }
          }

          Assert-SameHash (Join-Path $env:WSS_ARTIFACT_DIR 'WSS_Core_Interface.dll') (Join-Path $outputDir 'WSS_Core_Interface.dll')
          Assert-SameHash (Join-Path $env:WSS_BLE_ARTIFACT_DIR 'WSS.Transport.BLE.dll') (Join-Path $outputDir 'WSS.Transport.BLE.dll')

      - name: Run Test transport smoke checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = 'src/bin/Release/net9.0/CLI_CSharp_WSS_Application.dll'
          "exit`n" | & dotnet $cli --test
          if ($LASTEXITCODE -ne 0) { throw 'CLI Test transport smoke check failed.' }
          "exit`n" | & dotnet $cli --transport=test
          if ($LASTEXITCODE -ne 0) { throw 'CLI explicit Test transport smoke check failed.' }

      - name: Run CLI behavioral conformance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & dotnet 'src/bin/Release/net9.0/CLI_CSharp_WSS_Application.dll' --conformance
          if ($LASTEXITCODE -ne 0) { throw 'CLI conformance command failed.' }
          $output | ForEach-Object { $_ }
          foreach ($expectedLine in @('Initialization: PASS', 'Direct analog: PASS', 'Result: PASS')) {
            if ($output -cnotcontains $expectedLine) {
              throw "CLI conformance output is missing: $expectedLine"
            }
          }

      - name: Run shared Integration conformance scenarios
        shell: pwsh
        run: >-
          dotnet test
          SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/Wss.CSharpImplementation.Tests.csproj
          -c Release
          --no-build
          --no-restore
          -p:TreatWarningsAsErrors=true
          "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR"
          "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
          --filter FullyQualifiedName~StimulationControllerConformanceTests

  platform-compatibility:
    name: CLI platform compatibility (${{ matrix.label }})
    needs: provenance
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Ubuntu
          - os: macos-latest
            label: macOS
    env:
      WSS_ARTIFACT_DIR: ${{ github.workspace }}/.wss-artifacts/universal
      WSS_BLE_ARTIFACT_DIR: ${{ github.workspace }}/.wss-artifacts/universal
    steps:
      - name: Create read-only Integration checkout token
        id: integration-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: CSharp_WSS_Integration_Lib
          permission-contents: read

      - name: Check out CLI
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve selected Integration SHA
        id: integration
        shell: pwsh
        env:
          SELECTED_SHA: ${{ needs.provenance.outputs.integration-sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = $env:SELECTED_SHA
          if ($sha -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve the selected Integration SHA.'
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Check out committed Integration submodule
        uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ steps.integration.outputs.sha }}
          path: SubModules/HFI_WSS_Csharp_Implementation
          token: ${{ steps.integration-token.outputs.token }}
          persist-credentials: false

      - name: Verify committed Integration checkout
        shell: pwsh
        env:
          EXPECTED_INTEGRATION_SHA: ${{ steps.integration.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $integrationPath = 'SubModules/HFI_WSS_Csharp_Implementation'
          $actualSha = (& git -C $integrationPath rev-parse HEAD).Trim()
          $remoteUrl = (& git -C $integrationPath remote get-url origin).Trim().TrimEnd('/')
          $normalizedRemote = $remoteUrl -replace '\.git$', ''
          if ($actualSha -ne $env:EXPECTED_INTEGRATION_SHA) {
            throw "Integration checkout mismatch. Expected $($env:EXPECTED_INTEGRATION_SHA); actual $actualSha."
          }
          if ($normalizedRemote -ne 'https://github.com/cwru-non-academic/CSharp_WSS_Integration_Lib') {
            throw "Unexpected Integration remote: $remoteUrl"
          }

      - name: Download verified universal artifact
        uses: actions/download-artifact@v4
        with:
          name: verified-wss-universal
          path: ${{ env.WSS_ARTIFACT_DIR }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Disable checked-in fallback and clean outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $integrationLib = 'SubModules/HFI_WSS_Csharp_Implementation/lib'
          if (-not (Test-Path -LiteralPath $integrationLib -PathType Container)) {
            throw 'The checked-in Integration lib directory is missing, so fallback disabling cannot be verified.'
          }
          Move-Item -LiteralPath $integrationLib -Destination "$integrationLib.ci-disabled"
          if (Test-Path -LiteralPath $integrationLib) {
            throw 'The checked-in Integration lib directory still exists after fallback disabling.'
          }
          foreach ($outputPath in @(
            'src/bin',
            'src/obj',
            'SubModules/HFI_WSS_Csharp_Implementation/src/bin',
            'SubModules/HFI_WSS_Csharp_Implementation/src/obj',
            'SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/bin',
            'SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/obj'
          )) {
            Remove-Item -LiteralPath $outputPath -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Restore with downloaded WSS artifacts
        shell: pwsh
        run: |
          dotnet restore CLI_CSharp_WSS_Application.sln "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'CLI restore failed.' }
          dotnet restore 'SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/Wss.CSharpImplementation.Tests.csproj' "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Integration platform test restore failed.' }

      - name: Build Release with downloaded WSS artifacts
        shell: pwsh
        run: |
          dotnet build CLI_CSharp_WSS_Application.sln -c Release --no-restore -p:TreatWarningsAsErrors=true "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed.' }
          dotnet build 'SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/Wss.CSharpImplementation.Tests.csproj' -c Release --no-restore -p:TreatWarningsAsErrors=true "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Integration platform test build failed.' }

      - name: Verify downloaded WSS propagation to CLI output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDir = 'src/bin/Release/net9.0'

          function Assert-SameHash([string] $SourceFile, [string] $OutputFile) {
            if (-not (Test-Path -LiteralPath $SourceFile -PathType Leaf)) {
              throw "Authoritative release file is missing: $SourceFile"
            }
            if (-not (Test-Path -LiteralPath $OutputFile -PathType Leaf)) {
              throw "CLI output file is missing: $OutputFile"
            }
            $sourceSha = (Get-FileHash -LiteralPath $SourceFile -Algorithm SHA256).Hash
            $outputSha = (Get-FileHash -LiteralPath $OutputFile -Algorithm SHA256).Hash
            if (-not $outputSha.Equals($sourceSha, [StringComparison]::OrdinalIgnoreCase)) {
              throw "CLI output hash mismatch for $OutputFile. Expected $sourceSha; actual $outputSha."
            }
          }

          function Assert-TreePropagated([string] $SourceRoot, [string] $RelativeTree) {
            $sourceTree = Join-Path $SourceRoot $RelativeTree
            $sourceFiles = @(Get-ChildItem -LiteralPath $sourceTree -File -Recurse)
            if ($sourceFiles.Count -eq 0) {
              throw "Authoritative release tree is missing or empty: $sourceTree"
            }
            foreach ($sourceFile in $sourceFiles) {
              $relativeFile = [IO.Path]::GetRelativePath($SourceRoot, $sourceFile.FullName)
              Assert-SameHash $sourceFile.FullName (Join-Path $outputDir $relativeFile)
            }
          }

          Assert-SameHash (Join-Path $env:WSS_ARTIFACT_DIR 'WSS_Core_Interface.dll') (Join-Path $outputDir 'WSS_Core_Interface.dll')
          Assert-SameHash (Join-Path $env:WSS_BLE_ARTIFACT_DIR 'WSS.Transport.BLE.dll') (Join-Path $outputDir 'WSS.Transport.BLE.dll')
          Assert-TreePropagated $env:WSS_BLE_ARTIFACT_DIR 'backends/windows'
          Assert-TreePropagated $env:WSS_BLE_ARTIFACT_DIR 'backends/linux'
          Assert-TreePropagated $env:WSS_BLE_ARTIFACT_DIR 'runtimes/win'
          Assert-TreePropagated $env:WSS_BLE_ARTIFACT_DIR 'runtimes/unix'
          Assert-TreePropagated $env:WSS_BLE_ARTIFACT_DIR 'runtimes/linux-x64'

      - name: Verify complete universal build and publish propagation
        shell: pwsh
        run: |
          ./SubModules/HFI_WSS_Csharp_Implementation/.github/scripts/Verify-WssOutput.ps1 -ArtifactRoot $env:WSS_ARTIFACT_DIR -OutputRoot 'src/bin/Release/net9.0'
          dotnet publish src/CLI_CSharp_WSS_Application.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR" "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR" -o "$env:RUNNER_TEMP/cli-publish"
          if ($LASTEXITCODE -ne 0) { throw 'CLI publish failed.' }
          ./SubModules/HFI_WSS_Csharp_Implementation/.github/scripts/Verify-WssOutput.ps1 -ArtifactRoot $env:WSS_ARTIFACT_DIR -OutputRoot "$env:RUNNER_TEMP/cli-publish"

      - name: Run platform runtime smoke checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = 'src/bin/Release/net9.0/CLI_CSharp_WSS_Application.dll'
          & dotnet $cli --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help smoke check failed.' }
          & dotnet $cli --serial-smoke
          if ($LASTEXITCODE -ne 0) { throw 'CLI Serial smoke check failed.' }

      - name: Run platform-dependent Integration tests
        shell: pwsh
        run: >-
          dotnet test
          SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/Wss.CSharpImplementation.Tests.csproj
          -c Release
          --no-build
          --no-restore
          -p:TreatWarningsAsErrors=true
          "-p:WSS_ARTIFACT_DIR=$env:WSS_ARTIFACT_DIR"
          "-p:WSS_BLE_ARTIFACT_DIR=$env:WSS_BLE_ARTIFACT_DIR"
          --filter "FullyQualifiedName~SerialRuntimeSelectionTests|FullyQualifiedName~BleBackendLoadingTests"
