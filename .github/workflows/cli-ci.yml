name: CLI CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-channel:
    name: Verified ordinary CI channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind the channel to the actual event and workflow source
        id: channel
        shell: pwsh
        run: ./.github/scripts/Resolve-OrdinaryCiChannel.ps1
      - name: Exercise ordinary channel and workflow contracts
        shell: pwsh
        run: ./.github/scripts/tests/OrdinaryCiChannel.Tests.ps1

  receipt-policy-boundary:
    needs: resolve-channel
    env:
      WSS_CI_CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
    name: Receipt policy bridge (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise canonical policy through the actual PowerShell adapter
        shell: pwsh
        # Dev here is only the synthetic contract fixture, never the execution channel.
        env:
          WSS_CI_CHANNEL: dev
        run: ./.github/scripts/tests/WssReleaseReceipt.Tests.ps1

  macos_evidence_contracts:
    needs: resolve-channel
    env:
      WSS_CI_CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
    name: macOS BLE evidence contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./.github/scripts/tests/MacOSBleEvidence.Tests.ps1

  release-receipt-contracts:
    needs: resolve-channel
    env:
      WSS_CI_CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
    name: Release receipt safety contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - shell: pwsh
        # Dev here is only the synthetic contract fixture, never the execution channel.
        env:
          WSS_CI_CHANNEL: dev
        run: ./.github/scripts/tests/WssReleaseReceipt.Tests.ps1

  general-conformance:
    needs: resolve-channel
    env:
      WSS_CI_CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
    name: CLI general conformance
    runs-on: ubuntu-latest
    steps:
      - name: Create read-only Integration checkout token
        id: integration-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: CSharp_WSS_Integration_Lib
          permission-contents: read

      - name: Check out CLI
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve committed Integration SHA
        id: integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (& git rev-parse 'HEAD:SubModules/HFI_WSS_Csharp_Implementation').Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve the committed Integration submodule SHA.'
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Check out committed Integration submodule
        uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ steps.integration.outputs.sha }}
          path: SubModules/HFI_WSS_Csharp_Implementation
          token: ${{ steps.integration-token.outputs.token }}
          persist-credentials: false

      - name: Verify committed Integration checkout
        shell: pwsh
        env:
          EXPECTED_INTEGRATION_SHA: ${{ steps.integration.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $integrationPath = 'SubModules/HFI_WSS_Csharp_Implementation'
          $actualSha = (& git -C $integrationPath rev-parse HEAD).Trim()
          $remoteUrl = (& git -C $integrationPath remote get-url origin).Trim().TrimEnd('/')
          $normalizedRemote = $remoteUrl -replace '\.git$', ''
          if ($actualSha -ne $env:EXPECTED_INTEGRATION_SHA) {
            throw "Integration checkout mismatch. Expected $($env:EXPECTED_INTEGRATION_SHA); actual $actualSha."
          }
          if ($normalizedRemote -ne 'https://github.com/cwru-non-academic/CSharp_WSS_Integration_Lib') {
            throw "Unexpected Integration remote: $remoteUrl"
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Clean build outputs
        shell: pwsh
        run: |
          foreach ($outputPath in @(
            'src/bin',
            'src/obj',
            'SubModules/HFI_WSS_Csharp_Implementation/src/bin',
            'SubModules/HFI_WSS_Csharp_Implementation/src/obj',
            'SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/bin',
            'SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/obj'
          )) {
            Remove-Item -LiteralPath $outputPath -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Create profile producer read token
        id: profile-core-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Prepare immutable profile test project
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.profile-core-token.outputs.token }}
        run: >-
          ./.github/scripts/Prepare-CSharpProfile.ps1
          -IntegrationRoot SubModules/HFI_WSS_Csharp_Implementation
          -WorkRoot "${{ runner.temp }}/wss-profile"

      - name: Restore shared conformance projects
        shell: pwsh
        run: |
          dotnet restore CLI_CSharp_WSS_Application.sln
          if ($LASTEXITCODE -ne 0) { throw 'CLI restore failed.' }
          dotnet restore "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false
          if ($LASTEXITCODE -ne 0) { throw 'Integration conformance test restore failed.' }

      - name: Build shared conformance projects
        shell: pwsh
        run: |
          dotnet build CLI_CSharp_WSS_Application.sln -c Release --no-restore -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed.' }
          dotnet build "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false -c Release --no-restore -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'Integration conformance test build failed.' }

      - name: Run Test transport smoke checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = 'src/bin/Release/net9.0/CLI_CSharp_WSS_Application.dll'
          "exit`n" | & dotnet $cli --test
          if ($LASTEXITCODE -ne 0) { throw 'CLI Test transport smoke check failed.' }
          "exit`n" | & dotnet $cli --transport=test
          if ($LASTEXITCODE -ne 0) { throw 'CLI explicit Test transport smoke check failed.' }

      - name: Run CLI behavioral conformance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & dotnet 'src/bin/Release/net9.0/CLI_CSharp_WSS_Application.dll' --conformance
          if ($LASTEXITCODE -ne 0) { throw 'CLI conformance command failed.' }
          $output | ForEach-Object { $_ }
          foreach ($expectedLine in @('Initialization: PASS', 'Direct analog: PASS', 'Result: PASS')) {
            if ($output -cnotcontains $expectedLine) {
              throw "CLI conformance output is missing: $expectedLine"
            }
          }

      - name: Run production CLI command profile
        shell: pwsh
        run: ./.github/scripts/Invoke-CliCommandConformance.ps1

      - name: Run additional production CLI reload boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./.github/scripts/tests/ReloadBoundaryWorkflow.Tests.ps1
          . ./.github/scripts/CSharpProfilesBootstrap.ps1
          Assert-CSharpProfileBootstrap
          . ./tools/CSharpProfiles/Profile.ps1
          if (!$env:WSS_PROFILE_EVIDENCE) { throw 'Verified profile preparation is required.' }
          $state = Get-Content -LiteralPath $env:WSS_PROFILE_EVIDENCE -Raw | ConvertFrom-Json
          $profile = Resolve-WssReviewedProfile $state.payload_root $state.profile.producer
          if ($profile.profile -cne $state.profile.profile -or $profile.core_dll_sha256 -cne $state.profile.core_dll_sha256) { throw 'Reload profile differs from verified preparation.' }
          $results = Join-Path $env:RUNNER_TEMP 'cli-reload-boundaries'
          New-Item -ItemType Directory -Force $results | Out-Null
          switch -CaseSensitive ($profile.profile) {
            'legacy-v1' {
              'Not applicable: legitimate legacy profile; this is not modern reload acceptance.' | Tee-Object "$results/legacy-not-applicable.log"
            }
            'layered-v1' {
              dotnet test tests/Wss.Cli.Reload.Tests/Wss.Cli.Reload.Tests.csproj -c Release -p:TreatWarningsAsErrors=true -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false "-p:WSS_ARTIFACT_DIR=$($state.payload_root)" "-p:WSS_BLE_ARTIFACT_DIR=$($state.payload_root)" --logger 'trx;LogFileName=reload.trx' --results-directory $results
              if ($LASTEXITCODE -ne 0) { throw 'Additional CLI reload boundaries failed.' }
              [xml]$trx = Get-Content "$results/reload.trx" -Raw
              $expected = @('AllJsonReloadWithoutCoreChangeAppliesModelAndDefaultPaWithoutReconnect', 'DirectoryFileAndParameterlessCommandsUseStartupDefaultsAndRetireOldStack', 'CoreOnlyCommandRebuildsEvenUnchangedAndRetainsAppliedModelAndCalibration', 'CoreCommandOnInactiveControllerDoesNotInitializeOrReadInvalidCore')
              $actual = @($trx.TestRun.Results.UnitTestResult)
              if ($actual.Count -ne 4 -or @(Compare-Object $expected @($actual.testName) -CaseSensitive).Count -ne 0 -or @($actual | Where-Object outcome -cne 'Passed').Count -ne 0) { throw 'Missing/duplicated/skipped/failed reload boundary tests.' }
            }
            default { throw 'Unknown reload capability profile.' }
          }
      - name: Retain additional CLI reload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-reload-boundaries
          if-no-files-found: warn
          path: ${{ runner.temp }}/cli-reload-boundaries/

      - name: Run shared Integration conformance scenarios
        shell: pwsh
        run: ./.github/scripts/Invoke-ProfileBehavior.ps1

  platform-compatibility:
    needs: resolve-channel
    env:
      WSS_CI_CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
    name: CLI platform compatibility (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Ubuntu
    steps:
      - name: Create read-only Integration checkout token
        id: integration-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: CSharp_WSS_Integration_Lib
          permission-contents: read

      - name: Check out CLI
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve committed Integration SHA
        id: integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (& git rev-parse 'HEAD:SubModules/HFI_WSS_Csharp_Implementation').Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve the committed Integration submodule SHA.'
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Check out committed Integration submodule
        uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ steps.integration.outputs.sha }}
          path: SubModules/HFI_WSS_Csharp_Implementation
          token: ${{ steps.integration-token.outputs.token }}
          persist-credentials: false

      - name: Verify committed Integration checkout
        shell: pwsh
        env:
          EXPECTED_INTEGRATION_SHA: ${{ steps.integration.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $integrationPath = 'SubModules/HFI_WSS_Csharp_Implementation'
          $actualSha = (& git -C $integrationPath rev-parse HEAD).Trim()
          $remoteUrl = (& git -C $integrationPath remote get-url origin).Trim().TrimEnd('/')
          $normalizedRemote = $remoteUrl -replace '\.git$', ''
          if ($actualSha -ne $env:EXPECTED_INTEGRATION_SHA) {
            throw "Integration checkout mismatch. Expected $($env:EXPECTED_INTEGRATION_SHA); actual $actualSha."
          }
          if ($normalizedRemote -ne 'https://github.com/cwru-non-academic/CSharp_WSS_Integration_Lib') {
            throw "Unexpected Integration remote: $remoteUrl"
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Clean build outputs
        shell: pwsh
        run: |
          foreach ($outputPath in @(
            'src/bin',
            'src/obj',
            'SubModules/HFI_WSS_Csharp_Implementation/src/bin',
            'SubModules/HFI_WSS_Csharp_Implementation/src/obj',
            'SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/bin',
            'SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/obj'
          )) {
            Remove-Item -LiteralPath $outputPath -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Create profile producer read token
        id: profile-core-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Prepare immutable profile test project
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.profile-core-token.outputs.token }}
        run: >-
          ./.github/scripts/Prepare-CSharpProfile.ps1
          -IntegrationRoot SubModules/HFI_WSS_Csharp_Implementation
          -WorkRoot "${{ runner.temp }}/wss-profile"

      - name: Restore committed state
        shell: pwsh
        run: |
          dotnet restore CLI_CSharp_WSS_Application.sln
          if ($LASTEXITCODE -ne 0) { throw 'CLI restore failed.' }
          dotnet restore "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false
          if ($LASTEXITCODE -ne 0) { throw 'Integration platform test restore failed.' }

      - name: Build committed state
        shell: pwsh
        run: |
          dotnet build CLI_CSharp_WSS_Application.sln -c Release --no-restore -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed.' }
          dotnet build "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false -c Release --no-restore -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'Integration platform test build failed.' }

      - name: Verify committed universal build and publish propagation
        shell: pwsh
        run: |
          $integration = 'SubModules/HFI_WSS_Csharp_Implementation'
          ./.github/scripts/Verify-WssOutput.ps1 -ArtifactRoot "$integration/lib" -OutputRoot 'src/bin/Release/net9.0' -ProjectPath 'src/CLI_CSharp_WSS_Application.csproj' -ProjectAssetsFile 'src/obj/project.assets.json'
          dotnet publish src/CLI_CSharp_WSS_Application.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true -o "$env:RUNNER_TEMP/cli-publish"
          if ($LASTEXITCODE -ne 0) { throw 'Committed CLI publish failed.' }
          ./.github/scripts/Verify-WssOutput.ps1 -ArtifactRoot "$integration/lib" -OutputRoot "$env:RUNNER_TEMP/cli-publish" -ProjectPath 'src/CLI_CSharp_WSS_Application.csproj' -ProjectAssetsFile 'src/obj/project.assets.json'

      - name: Run platform runtime smoke checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = 'src/bin/Release/net9.0/CLI_CSharp_WSS_Application.dll'
          & dotnet $cli --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help smoke check failed.' }
          & dotnet $cli --serial-smoke
          if ($LASTEXITCODE -ne 0) { throw 'CLI Serial smoke check failed.' }
          ./.github/scripts/Test-BleSmoke.ps1 -Cli $cli -Scratch "$env:RUNNER_TEMP/ble-cli-regression"

      - name: Run platform-dependent Integration tests
        shell: pwsh
        run: >-
          dotnet test
          "$env:WSS_PROFILE_PROJECT"
          -c Release
          --no-build
          --no-restore
          -p:TreatWarningsAsErrors=true
          --filter "FullyQualifiedName~SerialRuntimeSelectionTests|FullyQualifiedName~BleBackendLoadingTests"

  macos_architecture:
    needs: resolve-channel
    env:
      WSS_CI_CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
    name: macOS BLE detail (${{ matrix.cpu }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            label: macOS
            os: macos-15-intel
            arch: x64
            test_platform: x64
            cpu: Intel x86_64
          - name: macOS
            label: macOS
            os: macos-15
            arch: arm64
            test_platform: ARM64
            cpu: Apple Silicon arm64
    steps:
      - name: Create read-only Integration checkout token
        id: integration-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: CSharp_WSS_Integration_Lib
          permission-contents: read

      - name: Check out CLI
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve committed Integration SHA
        id: integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (& git rev-parse 'HEAD:SubModules/HFI_WSS_Csharp_Implementation').Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve the committed Integration submodule SHA.'
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Check out committed Integration submodule
        uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ steps.integration.outputs.sha }}
          path: SubModules/HFI_WSS_Csharp_Implementation
          token: ${{ steps.integration-token.outputs.token }}
          persist-credentials: false

      - name: Verify committed Integration checkout
        shell: pwsh
        env:
          EXPECTED_INTEGRATION_SHA: ${{ steps.integration.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $integrationPath = 'SubModules/HFI_WSS_Csharp_Implementation'
          $actualSha = (& git -C $integrationPath rev-parse HEAD).Trim()
          $remoteUrl = (& git -C $integrationPath remote get-url origin).Trim().TrimEnd('/')
          $normalizedRemote = $remoteUrl -replace '\.git$', ''
          if ($actualSha -ne $env:EXPECTED_INTEGRATION_SHA) {
            throw "Integration checkout mismatch. Expected $($env:EXPECTED_INTEGRATION_SHA); actual $actualSha."
          }
          if ($normalizedRemote -ne 'https://github.com/cwru-non-academic/CSharp_WSS_Integration_Lib') {
            throw "Unexpected Integration remote: $remoteUrl"
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Verify native macOS and dotnet architecture
        shell: pwsh
        env:
          DOTNET_CLI_UI_LANGUAGE: en-US
        run: |
          . ./.github/scripts/MacOSBleEvidence.ps1
          Initialize-WssMacOSEvidence '${{ matrix.arch }}' 'cli-normal' "$env:RUNNER_TEMP/macos-evidence"
      - name: Clean build outputs
        shell: pwsh
        run: |
          foreach ($outputPath in @(
            'src/bin',
            'src/obj',
            'SubModules/HFI_WSS_Csharp_Implementation/src/bin',
            'SubModules/HFI_WSS_Csharp_Implementation/src/obj',
            'SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/bin',
            'SubModules/HFI_WSS_Csharp_Implementation/tests/Wss.CSharpImplementation.Tests/obj'
          )) {
            Remove-Item -LiteralPath $outputPath -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Create profile producer read token
        id: profile-core-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Prepare immutable profile test project
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.profile-core-token.outputs.token }}
        run: >-
          ./.github/scripts/Prepare-CSharpProfile.ps1
          -IntegrationRoot SubModules/HFI_WSS_Csharp_Implementation
          -WorkRoot "${{ runner.temp }}/wss-profile"

      - name: Restore committed state
        shell: pwsh
        run: |
          dotnet restore CLI_CSharp_WSS_Application.sln
          if ($LASTEXITCODE -ne 0) { throw 'CLI restore failed.' }
          dotnet restore "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false
          if ($LASTEXITCODE -ne 0) { throw 'Integration platform test restore failed.' }

      - name: Build committed state
        shell: pwsh
        run: |
          dotnet build CLI_CSharp_WSS_Application.sln -c Release --no-restore -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed.' }
          dotnet build "$env:WSS_PROFILE_PROJECT" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false -c Release --no-restore -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'Integration platform test build failed.' }

      - name: Verify committed universal build and publish propagation
        shell: pwsh
        run: |
          $integration = 'SubModules/HFI_WSS_Csharp_Implementation'
          ./.github/scripts/Verify-WssOutput.ps1 -ArtifactRoot "$integration/lib" -OutputRoot 'src/bin/Release/net9.0' -ProjectPath 'src/CLI_CSharp_WSS_Application.csproj' -ProjectAssetsFile 'src/obj/project.assets.json'
          dotnet publish src/CLI_CSharp_WSS_Application.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true -o "$env:RUNNER_TEMP/cli-publish"
          if ($LASTEXITCODE -ne 0) { throw 'Committed CLI publish failed.' }
          ./.github/scripts/Verify-WssOutput.ps1 -ArtifactRoot "$integration/lib" -OutputRoot "$env:RUNNER_TEMP/cli-publish" -ProjectPath 'src/CLI_CSharp_WSS_Application.csproj' -ProjectAssetsFile 'src/obj/project.assets.json'

      - name: Run platform runtime smoke checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = 'src/bin/Release/net9.0/CLI_CSharp_WSS_Application.dll'
          & dotnet $cli --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help smoke check failed.' }
          & dotnet $cli --serial-smoke
          if ($LASTEXITCODE -ne 0) { throw 'CLI Serial smoke check failed.' }
          ./.github/scripts/Test-BleSmoke.ps1 -Cli $cli -Scratch "$env:RUNNER_TEMP/ble-cli-regression" | Tee-Object -FilePath "$env:RUNNER_TEMP/macos-cli.log"

      - name: Run platform-dependent Integration tests
        shell: pwsh
        run: |
          & dotnet test "$env:WSS_PROFILE_PROJECT" -c Release --no-build --no-restore -p:TreatWarningsAsErrors=true --filter "FullyQualifiedName~SerialRuntimeSelectionTests|FullyQualifiedName~BleBackendLoadingTests" --logger 'console;verbosity=detailed' --logger 'trx;LogFileName=macos-platform.trx' --results-directory "$env:RUNNER_TEMP/macos-results" -- RunConfiguration.TargetPlatform=${{ matrix.test_platform }} | Tee-Object -FilePath "$env:RUNNER_TEMP/macos-platform.log"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical platform tests failed.' }

      - name: Record canonical packaged BLE result before any synthetic fixture
        if: always()
        shell: pwsh
        run: |
          . ./.github/scripts/MacOSBleEvidence.ps1
          Write-WssMacOSEvidence '${{ matrix.arch }}' 'cli-normal' "$env:RUNNER_TEMP/macos-evidence" "$env:RUNNER_TEMP/macos-results/macos-platform.trx" "$env:RUNNER_TEMP/macos-platform.log" 'src/bin/Release/net9.0' -CliLog "$env:RUNNER_TEMP/macos-cli.log" -IntegrationSha '${{ steps.integration.outputs.sha }}'


      - name: Finalize architecture evidence including all worker steps
        if: always()
        shell: pwsh
        env:
          WORKER_RESULT: ${{ job.status }}
        run: |
          . ./.github/scripts/MacOSBleEvidence.ps1
          Finalize-WssMacOSEvidence '${{ matrix.arch }}' 'cli-normal' "$env:RUNNER_TEMP/macos-evidence" $env:WORKER_RESULT
      - name: Retain architecture-specific canonical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wss-macos-cli-normal-${{ matrix.arch }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-evidence/*.json
            ${{ runner.temp }}/macos-results/*.trx
            ${{ runner.temp }}/macos-platform.log
            ${{ runner.temp }}/macos-cli.log
          if-no-files-found: error

  macos_compatibility:
    name: CLI platform compatibility (macOS)
    needs: [resolve-channel, macos_architecture]
    env:
      WSS_CI_CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful channel resolution
        if: always()
        shell: pwsh
        env:
          CHANNEL_RESULT: ${{ needs.resolve-channel.result }}
        run: |
          if ($env:CHANNEL_RESULT -cne 'success' -or $env:WSS_CI_CHANNEL -cnotin @('dev', 'main')) { throw 'Ordinary channel resolution did not succeed.' }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gather both native architecture records
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: wss-macos-cli-normal-*-a${{ github.run_attempt }}
          path: macos-evidence
      - name: Require Intel and Apple Silicon success and show failures separately
        if: always()
        shell: pwsh
        env:
          WORKER_RESULT: ${{ needs.macos_architecture.result }}
        run: |
          . ./.github/scripts/MacOSBleEvidence.ps1
          Complete-WssMacOSGate 'macos-evidence' 'cli-normal' $env:WORKER_RESULT
